services:
  pipeline:
    build: .
    image: modelo-bcb
    command: run-all
    volumes:
      - ./downloader/data:/app/downloader/data
      - ./modelo-integrado/output:/app/modelo-integrado/output
      - ./docs/figures:/app/docs/figures
    environment:
      - PYTHONUNBUFFERED=1

  dashboard:
    image: modelo-bcb
    build: .
    command: streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./downloader/data:/app/downloader/data
      - ./modelo-integrado/output:/app/modelo-integrado/output
      - ./docs/figures:/app/docs/figures
    environment:
      - PYTHONUNBUFFERED=1
